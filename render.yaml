services:
  - type: web
    name: Ahordian
    env: python
    region: oregon
    plan: starter
    branch: dev
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
    autoDeploy: true
