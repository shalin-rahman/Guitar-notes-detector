services:
  - type: web
    name: Ahordian
    env: python
    region: oregon
    plan: starter
    branch: dev
    pythonVersion: 3.12
    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    autoDeploy: true
